# Root logger level
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss:SSS

# Application logs
org.slf4j.simpleLogger.log.com.rsl.restaurant=info

# Suppress Kafka client internal config dump
org.slf4j.simpleLogger.log.org.apache.kafka=warn
org.slf4j.simpleLogger.log.org.apache.kafka.clients.producer.ProducerConfig=warn
org.slf4j.simpleLogger.log.org.apache.kafka.clients.consumer.ConsumerConfig=warn
